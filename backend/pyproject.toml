[project]
name = "irm-platform-backend"
version = "0.1.0"
description = "Backend API for the IRM Platform"
requires-python = ">=3.14"
dependencies = [
    "alembic",
    "argon2-cffi",
    "email-validator",
    "fastapi",
    "pydantic-settings",
    "psycopg[binary]",
    "sqlalchemy",
    "uvicorn[standard]",
    "python-multipart",
    "pymupdf",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
